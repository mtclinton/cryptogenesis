version: '3.8'

services:
  # Mining Node (produces blocks)
  node1:
    build: .
    container_name: cryptogenesis-node1
    ports:
      - "18333:18333"
    environment:
      - NODE_ID=1
      - NETWORK_MODE=private
      - ENABLE_MINING=true
      - ENABLE_GUI=false
      - DATA_DIR=/app/data/node1
    volumes:
      - ./data/node1:/app/data/node1
      - ./config/node1:/app/config:ro
    command: ["--private-network", "--mining"]
    networks:
      - cryptogenesis-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from cryptogenesis.services import get_services; services = get_services(); print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Relay Node (relays transactions and blocks)
  node2:
    build: .
    container_name: cryptogenesis-node2
    ports:
      - "18334:18333"
    environment:
      - NODE_ID=2
      - NETWORK_MODE=private
      - ENABLE_MINING=false
      - ENABLE_GUI=false
      - DATA_DIR=/app/data/node2
      - PEER_SEEDS=node1:18333
    volumes:
      - ./data/node2:/app/data/node2
      - ./config/node2:/app/config:ro
    command: ["--private-network", "--network"]
    depends_on:
      - node1
    networks:
      - cryptogenesis-net
    restart: unless-stopped

  # Full Node with GUI (for monitoring)
  node3:
    build: .
    container_name: cryptogenesis-node3
    ports:
      - "18335:18333"
    environment:
      - NODE_ID=3
      - NETWORK_MODE=private
      - ENABLE_MINING=false
      - ENABLE_GUI=false  # Set to true if you want GUI in container
      - DATA_DIR=/app/data/node3
      - PEER_SEEDS=node1:18333,node2:18333
      - DISPLAY=:99
    volumes:
      - ./data/node3:/app/data/node3
      - ./config/node3:/app/config:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["--private-network"]
    depends_on:
      - node1
      - node2
    networks:
      - cryptogenesis-net
    restart: unless-stopped

  # Optional: VNC Server for GUI access (if GUI is enabled)
  # Uncomment and use if you want GUI access via web browser
  # vnc-server:
  #   image: dorowu/ubuntu-desktop-lxde-vnc
  #   container_name: cryptogenesis-vnc
  #   ports:
  #     - "6080:80"
  #   environment:
  #     - RESOLUTION=1280x720
  #   networks:
  #     - cryptogenesis-net
  #   depends_on:
  #     - node3

networks:
  cryptogenesis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  node1_data:
    driver: local
  node2_data:
    driver: local
  node3_data:
    driver: local
